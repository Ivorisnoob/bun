name: Manual macOS Baseline Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build darwin-x64-baseline
    runs-on: macos-13 # x86_64 runner — native build, no cross-compilation needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          brew install automake ccache cmake coreutils gnu-sed go icu4c libiconv libtool ninja pkg-config rust ruby llvm@21
          echo "/usr/local/opt/llvm@21/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Build Bun
        run: |
          bun run build --baseline=true --profile=${{ github.event.inputs.profile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-darwin-x64-baseline-${{ github.event.inputs.profile }}
          path: build/${{ github.event.inputs.profile }}/bun*
