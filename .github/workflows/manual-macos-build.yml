name: Manual macOS Baseline Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build darwin-x64-baseline
    runs-on: macos-14 # Apple Silicon runner (faster), will cross-compile to x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false # We'll handle submodules manually if needed to save time

      - name: Install Dependencies
        run: |
          brew install automake ccache cmake coreutils gnu-sed go icu4c libiconv libtool ninja pkg-config rust ruby llvm@21
          echo "/opt/homebrew/opt/llvm@21/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Install Rust x86_64 target
        run: |
          rustup target add x86_64-apple-darwin

          # lolhtml pins a specific nightly in its rust-toolchain.toml.
          # Cargo downloads that toolchain at build time, AFTER this step, so the
          # loop-over-installed-toolchains approach misses it.  Fix: fetch the
          # exact pinned channel from the lolhtml commit and pre-install it with
          # the x86_64 target so cargo finds it ready when it runs.
          LOLHTML_COMMIT="77127cd2b8545998756e8d64e36ee2313c4bb312"
          LOLHTML_TOOLCHAIN=$(curl -sf \
            "https://raw.githubusercontent.com/cloudflare/lol-html/${LOLHTML_COMMIT}/rust-toolchain.toml" \
            | grep -E '^channel\s*=' | sed 's/.*= *"\(.*\)"/\1/')
          if [ -n "$LOLHTML_TOOLCHAIN" ]; then
            echo "lolhtml pins toolchain: $LOLHTML_TOOLCHAIN"
            rustup toolchain install "$LOLHTML_TOOLCHAIN" \
              --target x86_64-apple-darwin --no-self-update
          fi

          # Also cover any other already-installed toolchains for good measure.
          for toolchain in $(rustup toolchain list | awk '{print $1}'); do
            rustup target add x86_64-apple-darwin --toolchain "$toolchain" || true
          done

      - name: Build Bun
        run: |
          bun run build --os=darwin --arch=x64 --baseline=true --profile=${{ github.event.inputs.profile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-darwin-x64-baseline-${{ github.event.inputs.profile }}
          path: build/${{ github.event.inputs.profile }}/bun*
